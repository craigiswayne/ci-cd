name: "Dynamic Values"

on:
  push:

jobs:
  info_without_checkout:
    runs-on: ubuntu-latest

    steps:
      - name: Save Values to ENV
        run: |
          echo "REPOSITORY_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV

      - name: Print Values from ENV
        run: |
          echo "REPOSITORY_NAME: ${{ env.REPOSITORY_NAME }}"

      - name: Print some variables
        run: |
          echo "GITHUB REPOSITORY:                    ${GITHUB_REPOSITORY}"
          echo "GITHUB REPOSITORY OWNER:              ${GITHUB_REPOSITORY_OWNER}"
          echo "REPO_NAME FROM ENV (v1):              $REPOSITORY_NAME";
          echo "REPO_NAME FROM ENV (v2):              ${{ env.REPOSITORY_NAME }}";
          echo ""
          echo "Using Context..."
          echo "Go to: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/accessing-contextual-information-about-workflow-runs#github-context"
          echo "RUNNER OS:                            ${{runner.os}}"
          echo "TIMESTAMP:                            ${{ github.event.repository.updated_at}}";
          echo "GITHUB REPOSITORY:                    ${{github.repository}}"
          echo "GITHUB REPOSITORY OWNER:              ${{github.repository_owner}}"
          echo "CALCULATED REPO NAME:                 "$(basename ${{ github.repository }})
          echo "GITHUB RUN ID:                        ${{github.run_id}}"
          echo "GITHUB RUN ATTEMPT:                   ${{github.run_attempt}}"
          echo "GITHUB REF:                           ${{github.ref}}"
          echo "GITHUB EVENT (PULL REQUEST MERGED?):  ${{github.event.pull_request.merged}}"
          echo ""

  checkout_with_all_history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Latest Tag
        run: |
          LATEST_GIT_TAG=$(git describe --tags --abbrev=0)
          echo "LATEST_GIT_TAG=$LATEST_TAG" >> $GITHUB_ENV

      - name: Print some variables
        run: |
          echo "LATEST_TAG: $LATEST_TAG"
          echo "LATEST_TAG: ${{ env.LATEST_TAG }}"
