on:
  workflow_call:
    inputs:
      build_command:
        type: string
        default: 'build'
      install_command:
        type: string
        default: 'install'
      test_command:
        type: string
        default: 'test'
      run_lint:
        type: boolean
        default: true
      run_test:
        type: boolean
        default: true

jobs:
  npm_install_build_test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [ 20 ]
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js (v${{matrix.node-version}})
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node-version}}
          cache-dependency-path: 'package-lock.json'
          cache: npm

      - name: Install
        run: npm ${{ inputs.install_command }}

      - name: Build
        run: npm run ${{ inputs.build_command }}

      - name: Lint
        if: inputs.run_lint
        run: npm run lint

      - name: Test
        if: inputs.run_test
        run: npm run ${{ inputs.test_command }}
