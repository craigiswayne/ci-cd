name: Publish to Docker

on:
  workflow_call:
    inputs:
      docker_hub_username:
        description: 'Your dockerhub username'
        type: string
        required: true
      docker_hub_repository:
        description: 'Your dockerhub repository'
        type: string
        required: true
      docker_image_tag:
        description: 'The tag applied to your docker image'
        type: string
        default: 'latest'
    secrets:
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.docker_hub_username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ inputs.docker_hub_repository }}:${{ inputs.docker_image_tag }} .

      - name: Tag Docker Images
        run: |
          SOURCE_IMAGE_WITH_TAG="${{ inputs.docker_hub_repository }}:${{ inputs.docker_image_tag }}"
          docker tag $SOURCE_IMAGE_WITH_TAG ${{inputs.docker_hub_username}}/${{ inputs.docker_hub_repository }}:${{ inputs.docker_image_tag }}

      - name: Push Docker Images
        run: |
          docker push ${{inputs.docker_hub_username}}/${{ inputs.docker_hub_repository }}:${{ inputs.docker_image_tag }}