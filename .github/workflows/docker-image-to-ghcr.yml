name: Publish to GHCR

on:
  workflow_call:
    secrets:
      GITHUB_TOKEN:
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: image_tag
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          if github.event_name == 'push' && github.ref == 'refs/heads/main'; then
            TAG=latest
          else
            TAG=${{ github.run_number }}-${{ github.sha }}
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "REGISTRY_IMAGE=$IMAGE_NAME:$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: docker_build_push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.image_tag.outputs.REGISTRY_IMAGE }}
          file: Dockerfile
#          build-args: # Optional build arguments
          # ARG1: value1
          # ARG2: value2

      - name: Image details
        if: steps.docker_build_push.outputs.digest
        run: |
          echo "Digest: ${{ steps.docker_build_push.outputs.digest }}"
          echo "Pushed to: ${{ steps.image_tag.outputs.REGISTRY_IMAGE }}"

