name: Publish to Docker

on:
  workflow_call:
    inputs:
      docker_hub_username:
        description: 'Your dockerhub username'
        type: string
        required: true
      docker_hub_repository:
        description: 'Your dockerhub repository'
        type: string
        required: true

jobs:
  build_and_containerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: get_version
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.docker_hub_username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ inputs.docker_hub_repository }}:${{ env.VERSION }} .

      - name: Tag Docker Images
        run: |
          docker tag ${{ inputs.docker_hub_repository }}:${{ env.VERSION }} ${{inputs.docker_hub_username}}"/:${{ env.VERSION }}
          docker tag ${{ inputs.docker_hub_repository }}:${{ env.VERSION }} ${{inputs.docker_hub_username}}"/${{ inputs.docker_hub_repository }}:latest

      - name: Push Docker Images
        run: |
          docker push ${{inputs.docker_hub_username}}/${{ inputs.docker_hub_repository }}:${{ env.VERSION }}
          docker push ${{inputs.docker_hub_username}}/${{ inputs.docker_hub_repository }}:latest

  release:
    needs: build_and_containerize
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          draft: false
          prerelease: false
        env:
          VERSION: ${{needs.build_and_containerize.outputs.new_version}}
