name: Publish to Docker

on:
  workflow_call:
    inputs:
      docker_hub_username:
        description: 'Your dockerhub username'
        type: string
        required: true
      docker_hub_repository:
        description: 'Your dockerhub repository'
        type: string
        required: true
    secrets:
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build_and_containerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Latest Tag
        run: |
          LATEST_GIT_TAG=$(git describe --tags --abbrev=0)
          echo "LATEST_GIT_TAG=$LATEST_GIT_TAG" >> $GITHUB_ENV

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.docker_hub_username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ inputs.docker_hub_repository }}:${{ env.LATEST_GIT_TAG }} .

      - name: Tag Docker Images
        run: |
          SOURCE_IMAGE_WITH_TAG="${{ inputs.docker_hub_repository }}:${{ env.LATEST_GIT_TAG }}"
          docker tag $SOURCE_IMAGE_WITH_TAG ${{inputs.docker_hub_username}}/${{ inputs.docker_hub_repository }}:${{ env.LATEST_GIT_TAG }}
          docker tag $SOURCE_IMAGE_WITH_TAG ${{inputs.docker_hub_username}}/${{ inputs.docker_hub_repository }}:latest

      - name: Push Docker Images
        run: |
          docker push ${{inputs.docker_hub_username}}/${{ inputs.docker_hub_repository }}:${{ env.LATEST_GIT_TAG }}
          docker push ${{inputs.docker_hub_username}}/${{ inputs.docker_hub_repository }}:latest

